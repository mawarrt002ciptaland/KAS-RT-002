    <meta name="theme-color" content="#0f9f6e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="SI RT 002" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Inline manifest fallback (works even when only index.html is served)
      (function () {
        try {
          var origin = location.origin;
          var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0f9f6e"/><path d="M256 118 118 236h40v150h72V286h52v100h72V236h40z" fill="#fff"/><rect x="176" y="404" width="160" height="30" rx="15" fill="#ffffff" opacity=".85"/></svg>';
          var svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
          var manifest = {
            name: 'Sistem Informasi RT 002 Blok Mawar Ciptaland',
            short_name: 'SI RT 002',
            description: 'Digital Operating System RT 002 RW 014 Blok Mawar Perumahan Ciptaland Batam',
            start_url: origin + location.pathname,
            scope: origin + location.pathname,
            display: 'standalone',
            orientation: 'portrait',
            theme_color: '#0f9f6e',
            background_color: '#f6fbf8',
            lang: 'id',
            icons: [
              { src: origin + '/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: origin + '/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
              { src: svgUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }
            ]
          };
          var link = document.querySelector('link[rel="manifest"]');
          fetch('/manifest.json', { method: 'HEAD' }).then(function (r) {
            if (!r.ok) throw new Error('no manifest');
          }).catch(function () {
            if (link) link.setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));
          });
        } catch (e) {}
      })();
      // Theme bootstrap (avoid flash)
      (function () {
        try {
          var raw = localStorage.getItem('rt002-ui');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null;
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
      // Service worker (offline fallback) — silently ignored when unavailable
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
